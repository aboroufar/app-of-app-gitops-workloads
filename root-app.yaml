apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aboroufar/app-of-app-gitops-workloads.git
    targetRevision: main
    path: bootstrap
  destination:
    # Root manifests (Application / ApplicationSet) MUST be applied to ArgoCD's home cluster
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true