apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payment-api-workloads
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: payment-dev
          - env: prod
            namespace: payment-prod
  template:
    metadata:
      name: 'payment-api-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/aboroufar/app-of-app-gitops-workloads.git
        targetRevision: local
        path: 'apps/payment-api/overlays/{{env}}'
      destination:
        name: aws-eks-prod
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true ## Applies only manifests whose hashes changed, preventing unnecessary cluster API load.
          - RespectIgnoreDifferences=true # Tell the sync engine NOT to overwrite the ignored fields
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
