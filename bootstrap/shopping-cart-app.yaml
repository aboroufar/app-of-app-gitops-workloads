apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-cart-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aboroufar/app-of-app-gitops-workloads.git
    targetRevision: main
    path: apps/shopping-cart/kustomize-wrapper
    kustomize:
      buildOptions: --enable-helm ## enable helm support which is disabled by default in ArgoCD's
  destination:
    name: aws-eks-prod
    namespace: shopping-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
