apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-cart-prod
  namespace: argocd
spec:
  project: ecommerce-workloads
  source:
    repoURL: https://github.com/aboroufar/app-of-app-gitops-workloads.git
    targetRevision: local
    path:  apps/shopping-cart/overlays/prod
  destination:
    name: in-cluster
    namespace: shopping-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
